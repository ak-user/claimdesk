[project]
name = "claimdesk"
version = "0.1.0"
description = "Benefits Q&A with citations, a tool-calling agent and claim intake checks, on Azure OpenAI."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "openai>=1.40",
  "numpy>=1.26",
  "pypdf>=4.2",
  "python-multipart>=0.0.9",
  "snowballstemmer>=2.2",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17"]
mlflow = ["mlflow-skinny>=2.14"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claimdesk*"]

[tool.setuptools.package-data]
claimdesk = ["data/*.json", "data/policy/*.md", "data/sample_claims/*", "eval/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
